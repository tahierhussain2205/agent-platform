; Local stand-in for Render's managed PgBouncer: transaction pooling, SCRAM, any database name and
; any database user (auth_query looks the user up in Postgres, so login users created by
; `app migrate` and throwaway test users work without editing this file).
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = postgres
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 0
server_idle_timeout = 60
ignore_startup_parameters = extra_float_digits,options
admin_users = postgres

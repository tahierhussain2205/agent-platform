        sm7TFl1WJSYXH+5wy13cAZABEQ==
        -----END PRIVATE KEY-----
      GOOGLE_TOKEN_URL: http://fakes:4100/google/token
      GOOGLE_REVOKE_URL: http://fakes:4100/google/revoke
      GOOGLE_USERINFO_URL: http://fakes:4100/google/userinfo
      GOOGLE_CLIENT_SECRET: local-google-client-secret
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: node:22-slim
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "1"
      npm_config_store_dir: /pnpm-store
      VITE_API_URL: http://localhost:8000
      VITE_DEV_AUTH_URL: http://localhost:4100/clerk
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  fakesdata:
  pgdata:
  temporaldata:
  objectdata:
  web_node_modules:
  pnpm_store:

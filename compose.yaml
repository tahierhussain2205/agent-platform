# Local environment: `make dev` starts everything, `make infra` only the dependencies.
# The backend services run the same image (backend/Dockerfile) and commands as Render.
# Host ports are offset (55432, 56379, ...) to avoid clashing with services already running locally.

name: agentplatform

x-backend: &backend
  # Built once by the `migrate` service; the other backend services reuse the tag.
  image: agentplatform-backend:local
  pull_policy: never
  environment: &backend-env
    ENV: local
    LOG_LEVEL: INFO
    # Migrations run as the Render-like database owner (not a superuser).
    MIGRATION_DATABASE_URL: postgresql://agent_admin:agent_admin@postgres:5432/agent
    # Components swap in their own login user; see Settings.component_dsn().
    DATABASE_URL: postgresql://unused:unused@pgbouncer:6432/agent
    DB_API_PASSWORD: local-api-password-0001
    DB_WORKER_PASSWORD: local-worker-password-0001
    DB_VAULT_PASSWORD: local-vault-password-0001
    DB_IDENTITY_PASSWORD: local-identity-password-0001
    DB_MAINTENANCE_PASSWORD: local-maintenance-password-0001
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: agent-tasks
    REDIS_URL: redis://valkey:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Local development keys only (never use these anywhere else).
    ENCRYPTION_KEYS: v1:bG9jYWwtZGV2LWtleS0wMDAwMDAwMDAwMDAwMDAwMDA=
    ENCRYPTION_ACTIVE_KEY: v1
    S3_ENDPOINT_URL: http://objectstore:8333
    S3_BUCKET: artifacts
    S3_ACCESS_KEY_ID: local-access-key
    S3_SECRET_ACCESS_KEY: local-secret-key
    # Clerk stand-in (fakes service). Real Clerk: issuer = Frontend API URL, JWKS from it.
    CONSOLE_ORIGINS: http://localhost:5173
    CLERK_ISSUER: http://localhost:4100/clerk
    CLERK_JWKS_URL: http://fakes:4100/clerk/.well-known/jwks.json
    CLERK_API_URL: http://fakes:4100/clerk/v1
    CLERK_SECRET_KEY: sk_test_local
    CLERK_WEBHOOK_SECRET: whsec_bG9jYWwtY2xlcmstd2ViaG9vay1zZWNyZXQtMDAwMQ==
    # Slack stand-in (fakes service). The authorize URL is opened by the browser.
    API_PUBLIC_URL: http://localhost:8000
    CONSOLE_URL: http://localhost:5173
    SLACK_API_URL: http://fakes:4100/slack/api
    SLACK_AUTHORIZE_URL: http://localhost:4100/slack/oauth/v2/authorize
    SLACK_CLIENT_ID: local.client
    SLACK_CLIENT_SECRET: local-slack-client-secret
    SLACK_SIGNING_SECRET: local-slack-signing-secret
    SLACK_STATE_SECRET: local-slack-state-secret
    # Anthropic stand-in (fakes service). Real: https://api.anthropic.com and a real key (B-005).
    ANTHROPIC_API_URL: http://fakes:4100/anthropic
    ANTHROPIC_API_KEY: sk-ant-local-key
    # Token vault service; the API and worker call it with the shared token.
    VAULT_URL: http://vault:8100
    VAULT_SERVICE_TOKEN: local-vault-service-token
    OAUTH_STATE_SECRET: local-oauth-state-secret
    # Jira, GitHub and Google stand-ins (fakes service). Browser facing pages on localhost, API calls
    # inside the network; client secrets and the GitHub App key are only on the vault service.
    ATLASSIAN_AUTHORIZE_URL: http://localhost:4100/atlassian/authorize
    ATLASSIAN_API_URL: http://fakes:4100/atlassian/api
    ATLASSIAN_CLIENT_ID: local-jira-client
    GITHUB_WEB_URL: http://localhost:4100/github
    GITHUB_API_URL: http://fakes:4100/github/api
    GITHUB_APP_ID: "424242"
    GITHUB_APP_SLUG: agent-platform-local
    GITHUB_CLIENT_ID: Iv1.localclient
    GOOGLE_AUTH_URL: http://localhost:4100/google/o/oauth2/v2/auth
    GOOGLE_MCP_URL: http://fakes:4100/google/mcp
    GOOGLE_CLIENT_ID: local-google-client
  restart: "no"

services:
  # ------------------------------------------------------------------ infrastructure

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Transaction pooling like Render's built in PgBouncer; the API and worker connect through it.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports: ["56432:6432"]
    volumes:
      - ./dev/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./dev/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-port=8233
      - --db-filename=/home/temporal/temporal.db
    ports: ["7233:7233", "8233:8233"]
    volumes: [temporaldata:/home/temporal]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 40

  # S3 compatible object storage (stands in for AWS S3 or Cloudflare R2).
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: ["mini", "-dir=/data", "-bucket=artifacts", "-s3.config=/etc/seaweedfs/s3.json", "-admin.ui=false"]
    ports: ["8333:8333"]
    volumes:
      - objectdata:/data
      - ./dev/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Traces (OpenTelemetry over OTLP); UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:latest
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  # Local stand-ins for external SaaS (Clerk, Slack). Never deployed. Slack UI: http://localhost:4100/slack/ui
  fakes:
    build:
      context: ./fakes
    image: agentplatform-fakes:local
    environment:
      CONSOLE_ORIGINS: http://localhost:5173
      CLERK_ISSUER: http://localhost:4100/clerk
      CLERK_SECRET_KEY: sk_test_local
      CLERK_WEBHOOK_URL: http://api:8000/webhooks/clerk
      CLERK_WEBHOOK_SECRET: whsec_bG9jYWwtY2xlcmstd2ViaG9vay1zZWNyZXQtMDAwMQ==
      FAKES_SEED_FIXTURE: /seed/fixture.json
      SLACK_PUBLIC_URL: http://localhost:4100/slack
      SLACK_EVENTS_URL: http://api:8000/slack/events
      SLACK_INTERACTIONS_URL: http://api:8000/slack/interactions
      SLACK_CLIENT_ID: local.client
      SLACK_CLIENT_SECRET: local-slack-client-secret
      SLACK_SIGNING_SECRET: local-slack-signing-secret
      GITHUB_SETUP_URL: http://localhost:8000/oauth/github/install
      GITHUB_APP_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8fectfhINa8+mWW4IcPi
        JfQoE4xzmohWwMQIFFy9unFhrGdML0jUEg1qH/fziVz4OZABL96JdBsn40p501S7
        //KEELTuKiIbruxVuM/PyW4cNcY63Z9QOc86NgpPpQlB4Ku06An5dgfX4EL0oN2D
        2S0GnnjvXkuvrIZ6yNh05k2WNlrkBxwMCYRyL/eKtTAgJUm+x6pHuW+fYK/YnYhb
        MMibLEqR7netbVqK1l3+C8phrGDr1GWspdhPKM6ZCBO2Qbg7520ehR1FROQfCx07
        l27G9UQZ4y0TYvPcsWxcaCWVUZ5fimMSMOlo/ylfyr0sj9pWqONtnDLH7/TtLmZD
        0wIDAQAB
        -----END PUBLIC KEY-----
    ports: ["4100:4100"]
    volumes:
      - fakesdata:/data
      - ./backend/app/seed/fixture.json:/seed/fixture.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4100/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------ one shot jobs

  # Mirrors Render's preDeployCommand: the API only starts after migrations succeed.
  migrate:
    <<: *backend
    build:
      context: ./backend
    command: ["app", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    <<: *backend
    command: ["app", "seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ------------------------------------------------------------------ application

  api:
    <<: *backend
    command: ["app", "api"]
    environment:
      <<: *backend-env
      PORT: "8000"
    ports: ["8000:8000"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      vault: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"PORT\"]}/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["app", "worker"]
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      vault: { condition: service_healthy }

  # The token vault: its own database user, the providers' client secrets and the GitHub App key.
  # Not published on the host: only the API and worker reach it.
  vault:
    <<: *backend
    command: ["app", "vault"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: "8100"
      ATLASSIAN_TOKEN_URL: http://fakes:4100/atlassian/oauth/token
      ATLASSIAN_CLIENT_SECRET: local-jira-client-secret
      GITHUB_TOKEN_URL: http://fakes:4100/github/login/oauth/access_token
      GITHUB_CLIENT_SECRET: local-github-client-secret
      # Development only key pair (dev/github/README.md), valid only against the stand-in.
      GITHUB_APP_PRIVATE_KEY: |

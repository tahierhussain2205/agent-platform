name: CI

# Paused for speed while the main development goes on (2026-10-17, D-200): run it by hand from the
# Actions tab or `gh workflow run CI`. To bring it back, restore `push:` and `pull_request:` here
# and `autoDeployTrigger: checksPass` in render.yaml.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_TEMPORAL_ADDRESS: localhost:7233
      TEST_PGBOUNCER_HOSTPORT: localhost:56432
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_S3_ENDPOINT: http://localhost:8333
      TEST_FAKES_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v4
      # Service containers cannot take a command, so the Temporal dev server is started here.
      - name: Start Temporal dev server
        run: |
          docker run -d --name temporal -p 7233:7233 temporalio/temporal:latest server start-dev --ip 0.0.0.0
          for _ in $(seq 1 60); do
            docker exec temporal temporal operator cluster health --address 127.0.0.1:7233 && exit 0
            sleep 2
          done
          exit 1
      # Same PgBouncer config as Compose, pointed at the service container on the host network.
      - name: Start PgBouncer
        run: |
          sed -e 's/host=postgres/host=127.0.0.1/' -e 's/listen_port = 6432/listen_port = 56432/' \
            ../dev/pgbouncer/pgbouncer.ini > /tmp/pgbouncer.ini
          docker run -d --name pgbouncer --network host \
            -v /tmp/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro \
            -v "$PWD/../dev/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro" edoburu/pgbouncer:latest
      - name: Start object store
        run: |
          docker run -d --name objectstore -p 8333:8333 -v "$PWD/../dev/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest mini -dir=/data -bucket=artifacts -s3.config=/etc/seaweedfs/s3.json -admin.ui=false
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8333/status && exit 0; sleep 2; done; exit 1
      # The SaaS stand-ins (Clerk, Slack, Anthropic, Atlassian, GitHub, Google, Google Cloud, MCP, a
      # sandbox provider) the integration tests call over HTTP. The GitHub and Google Cloud stand-ins
      # verify signed requests with the local-only dev keys.
      # Sandbox commands run in the sandbox runner (B-008): its own container with no network at all,
      # sharing the sandboxes volume with the provider API, as in Compose.
      - name: Start SaaS stand-ins and the sandbox runner
        run: |
          docker build -q -t agentplatform-fakes:ci ../fakes
          docker build -q -t agentplatform-sandbox-runner:ci -f ../fakes/runner.Dockerfile ../fakes
          docker volume create sandboxes
          docker run -d --name fakes -p 4100:4100 \
            -e GITHUB_APP_PUBLIC_KEY="$(cat ../dev/github/app-dev-public-key.pem)" \
            -e GCP_SA_PUBLIC_KEY="$(cat ../dev/gcp/sa-dev-public-key.pem)" \
            -e SANDBOX_ROOT=/sandboxes -v sandboxes:/sandboxes \
            -v "$PWD/app/seed/fixture.json:/seed/fixture.json:ro" agentplatform-fakes:ci
          docker run -d --name sandbox-runner --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10001 --memory 1g --cpus 1 --pids-limit 256 \
            -e SANDBOX_ROOT=/sandboxes -v sandboxes:/sandboxes agentplatform-sandbox-runner:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4100/healthz && exit 0; sleep 1; done; exit 1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Tests
        run: uv run pytest
      - name: Schema mutation check
        run: ../scripts/schema_mutations.sh

  fakes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fakes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy fakes
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Boots the whole Compose stack and checks it the way a developer would after `make dev`.
  stack:
    runs-on: ubuntu-latest
    needs: [backend, fakes, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Smoke checks
        run: ./scripts/smoke.sh
      - name: Image checks
        run: ./scripts/test_image.sh
      - name: Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      # Replays the eval cases against the stand-ins; not a release gate yet (spec 15).
      - name: Eval suite (non blocking)
        continue-on-error: true
        run: docker compose exec -T worker app eval --report /tmp/eval.json
      - uses: astral-sh/setup-uv@v5
      - name: Render simulation
        run: |
          cd backend && uv sync --frozen && cd ..
          make render-sim
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

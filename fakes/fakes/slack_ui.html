<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slack (local stand-in)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; color: #1d1c1d; height: 100vh; display: flex; flex-direction: column; }
  header { background: #3f0e40; color: #fff; padding: 8px 12px; display: flex; gap: 12px; align-items: center; }
  header select, header button { font-size: 13px; }
  .app { flex: 1; display: flex; min-height: 0; }
  nav { width: 220px; background: #3f0e40; color: #cfc3cf; padding: 8px; overflow-y: auto; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  nav button.active { background: #1164a3; color: #fff; }
  nav h3 { font-size: 12px; text-transform: uppercase; margin: 12px 8px 4px; color: #a99aa9; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .bar { padding: 8px 16px; border-bottom: 1px solid #ddd; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .messages { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .msg { padding: 6px 0; border-bottom: 1px solid #f3f3f3; }
  .msg .who { font-weight: 700; }
  .msg .meta { color: #616061; font-size: 12px; margin-left: 6px; }
  .msg.ephemeral { background: #f8f8ff; border-left: 3px solid #1264a3; padding-left: 8px; }
  .msg .note { color: #616061; font-size: 12px; font-style: italic; }
  .blocks .section, .blocks .context { margin: 4px 0; white-space: pre-wrap; }
  .blocks .context { color: #616061; font-size: 12px; }
  .blocks .header { font-weight: 700; font-size: 16px; margin: 6px 0; }
  .blocks .actions button { margin-right: 6px; padding: 4px 12px; border: 1px solid #bbb; border-radius: 4px; background: #fff; cursor: pointer; }
  .blocks .actions button.primary { background: #007a5a; color: #fff; border-color: #007a5a; }
  .blocks .actions button.danger { background: #e01e5a; color: #fff; border-color: #e01e5a; }
  .replies { color: #1264a3; cursor: pointer; font-size: 12px; background: none; border: 0; padding: 0; }
  .composer { border-top: 1px solid #ddd; padding: 8px 16px; display: flex; gap: 8px; }
  .composer textarea { flex: 1; height: 48px; font: inherit; padding: 6px; }
  aside { width: 360px; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
  aside[hidden] { display: none; }
  .warn { background: #fff8e1; padding: 6px 16px; font-size: 13px; }
  .error { color: #e01e5a; padding: 4px 16px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <strong>Slack</strong>
  <label>Workspace <select id="team" aria-label="Workspace"></select></label>
  <label>Signed in as <select id="user" aria-label="Signed in as"></select></label>
  <span id="installed" style="font-size:12px"></span>
</header>
<div class="app">
  <nav aria-label="Channels">
    <button id="home-tab" data-testid="home-tab">Home (Agent)</button>
    <h3>Channels</h3>
    <div id="channels"></div>
    <h3>Direct messages</h3>
    <button id="dm" data-testid="dm-agent">Agent</button>
  </nav>
  <main>
    <div class="bar"><span id="title"></span><span id="bar-actions"></span></div>
    <div id="notice"></div>
    <div class="messages" id="messages" data-testid="messages"></div>
    <div class="error" id="error" role="alert"></div>
    <div class="composer" id="composer-row">
      <textarea id="composer" aria-label="Message" placeholder="Message (type @agent to mention the bot)"></textarea>
      <button id="send">Send</button>
    </div>
  </main>
  <aside id="thread-panel" hidden data-testid="thread">
    <div class="bar"><span>Thread</span><button id="close-thread" aria-label="Close thread">×</button></div>
    <div class="messages" id="thread-messages"></div>
    <div class="composer">
      <textarea id="thread-composer" aria-label="Reply" placeholder="Reply..."></textarea>
      <button id="thread-send">Reply</button>
    </div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
let view = { team: '', user: '', channel: '', thread: '', home: false };
let state = null;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mrkdwn(text) {
  let out = esc(text);
  out = out.replace(/&lt;@([A-Z0-9]+)&gt;/g, (_, id) => '@' + esc((state && state.names[id]) || id));
  out = out.replace(/&lt;(https?:[^|&]+)\|([^&]+)&gt;/g, '<a href="$1" target="_blank">$2</a>');
  out = out.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
  return out;
}

function renderBlocks(blocks, ctx) {
  if (!blocks) return '';
  return '<div class="blocks">' + blocks.map((b) => {
    if (b.type === 'header') return `<div class="header">${esc(b.text && b.text.text)}</div>`;
    if (b.type === 'section') {
      let accessory = '';
      if (b.accessory && b.accessory.type === 'static_select') {
        const initial = b.accessory.initial_option && b.accessory.initial_option.value;
        accessory = `<select data-action="${esc(b.accessory.action_id)}" data-block="${esc(b.block_id || '')}" aria-label="${esc(b.text && b.text.text)}">` +
          b.accessory.options.map((o) => `<option value="${esc(o.value)}" ${o.value === initial ? 'selected' : ''}>${esc(o.text.text)}</option>`).join('') + '</select>';
      }
      return `<div class="section">${mrkdwn(b.text && b.text.text)} ${accessory}</div>`;
    }
    if (b.type === 'context') return `<div class="context">${(b.elements || []).map((e) => mrkdwn(e.text)).join(' ')}</div>`;
    if (b.type === 'actions') return `<div class="actions">${(b.elements || []).map((e) =>
      `<button class="${esc(e.style || '')}" data-action="${esc(e.action_id)}" data-block="${esc(b.block_id || '')}" data-value="${esc(e.value || '')}" data-ts="${esc(ctx.ts || '')}">${esc(e.text && e.text.text)}</button>`).join('')}</div>`;
    if (b.type === 'divider') return '<hr>';
    return '';
  }).join('') + '</div>';
}

function renderMessage(m, opts = {}) {
  const name = state.names[m.user] || m.user;
  const body = m.blocks ? renderBlocks(m.blocks, { ts: m.ts }) : `<div>${mrkdwn(m.text)}</div>`;
  const replies = !opts.inThread && m.reply_count ? `<button class="replies" data-thread="${esc(m.ts)}">${m.reply_count} ${m.reply_count === 1 ? 'reply' : 'replies'}</button>` : '';
  const reply = !opts.inThread && !opts.ephemeral ? ` <button class="replies" data-thread="${esc(m.ts)}">Reply in thread</button>` : '';
  return `<div class="msg ${opts.ephemeral ? 'ephemeral' : ''}" data-testid="${opts.ephemeral ? 'ephemeral' : 'message'}" data-ts="${esc(m.ts)}" data-user="${esc(m.user || '')}">
    <span class="who">${esc(name)}</span><span class="meta">${new Date(parseFloat(m.ts) * 1000).toLocaleTimeString()}${m.edited ? ' (edited)' : ''}</span>
    ${opts.ephemeral ? '<div class="note">Only visible to you</div>' : ''}${body}${replies}${reply}</div>`;
}

let loads = 0;
async function load() {
  // Only the latest load may render: an older one (started before the person or channel changed)
  // would switch the view back.
  const mine = ++loads;
  const params = new URLSearchParams({ team: view.team, user: view.user, channel: view.channel, thread: view.thread });
  const res = await fetch('/slack/_ui/state?' + params);
  const next = await res.json();
  if (mine !== loads) return;
  state = next;
  if (!view.team && state.teams.length) { view.team = state.teams[0].id; return load(); }
  render();
}

function render() {
  const teamSel = $('team');
  teamSel.innerHTML = state.teams.map((t) => `<option value="${t.id}" ${t.id === view.team ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  if (!state.team) return;
  view.user = state.me; view.channel = view.home ? view.channel : state.channel;
  $('installed').textContent = state.team.installed ? 'Agent installed' : 'Agent not installed';
  $('user').innerHTML = state.people.map((p) => `<option value="${p.id}" ${p.id === state.me ? 'selected' : ''}>${esc(p.name)} (${esc(p.email)})</option>`).join('');
  $('channels').innerHTML = state.channels.map((c) =>
    `<button data-channel="${c.id}" class="${!view.home && c.id === state.channel ? 'active' : ''}">${c.is_private ? '🔒' : '#'} ${esc(c.name)}${c.is_archived ? ' (archived)' : ''}</button>`).join('');
  $('dm').classList.toggle('active', !view.home && state.dm && state.channel === state.dm.id);
  $('home-tab').classList.toggle('active', view.home);
  if (view.home) {
    $('title').textContent = 'Agent: Home';
    $('bar-actions').innerHTML = '';
    $('notice').innerHTML = '';
    $('messages').innerHTML = state.home ? renderBlocks(state.home.blocks, {}) : '<p>Loading the App Home…</p>';
    $('composer-row').hidden = true;
    $('thread-panel').hidden = true;
    return;
  }
  $('composer-row').hidden = false;
  const channel = state.channels.find((c) => c.id === state.channel);
  const isDm = state.dm && state.channel === state.dm.id;
  $('title').textContent = isDm ? 'Agent (direct message)' : channel ? `${channel.is_private ? '🔒' : '#'} ${channel.name}` : '';
  $('bar-actions').innerHTML = channel && !channel.bot_member && !channel.is_archived ? '<button id="invite-bot">Add Agent to this channel</button>' : '';
  $('notice').innerHTML = channel && !channel.member ? '<div class="warn">You are not a member of this channel. <button id="join">Join</button></div>' : '';
  const rows = state.messages.map((m) => renderMessage(m)).concat(state.ephemeral.filter((e) => !e.thread_ts).map((e) => renderMessage({ ...e, user: state.team.bot_user_id }, { ephemeral: true })));
  $('messages').innerHTML = rows.join('') || '<p style="color:#999">No messages yet.</p>';
  if (view.thread) {
    $('thread-panel').hidden = false;
    const parent = state.messages.find((m) => m.ts === view.thread);
    const threadEphemeral = state.ephemeral.filter((e) => e.thread_ts === view.thread).map((e) => renderMessage({ ...e, user: state.team.bot_user_id }, { ephemeral: true, inThread: true }));
    $('thread-messages').innerHTML = (parent ? renderMessage(parent, { inThread: true }) : '') + state.replies.map((m) => renderMessage(m, { inThread: true })).join('') + threadEphemeral.join('');
  } else {
    $('thread-panel').hidden = true;
  }
}

function toSlackText(text) {
  return text.replace(/@agent\b/gi, `<@${state.team.bot_user_id}>`);
}

async function post(text, thread) {
  $('error').textContent = '';
  const res = await fetch('/slack/_ui/post', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ team: view.team, user: view.user, channel: state.channel, text: toSlackText(text), thread_ts: thread || null }) });
  const body = await res.json();
  if (!body.ok) $('error').textContent = 'Error: ' + body.error;
  await load();
}

async function action(el, extra = {}) {
  await fetch('/slack/_ui/action', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
    team: view.team, user: view.user, channel: view.home ? null : state.channel, ts: el.dataset.ts || null, action_id: el.dataset.action,
    block_id: el.dataset.block || '', value: el.dataset.value || null, surface: view.home ? 'home' : 'message', ...extra }) });
  setTimeout(load, 300);
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.dataset.channel) { view.channel = t.dataset.channel; view.thread = ''; view.home = false; return load(); }
  if (t.id === 'dm') { view.channel = state.dm.id; view.thread = ''; view.home = false; return load(); }
  if (t.id === 'home-tab') {
    view.home = true; view.thread = '';
    await fetch('/slack/_ui/home', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ team: view.team, user: view.user }) });
    return load();
  }
  if (t.dataset.thread) { view.thread = t.dataset.thread; return load(); }
  if (t.id === 'close-thread') { view.thread = ''; return load(); }
  if (t.id === 'send') { const text = $('composer').value.trim(); if (text) { $('composer').value = ''; await post(text, null); } return; }
  if (t.id === 'thread-send') { const text = $('thread-composer').value.trim(); if (text) { $('thread-composer').value = ''; await post(text, view.thread); } return; }
  if (t.id === 'invite-bot') { await fetch('/slack/_ui/invite-bot', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ team: view.team, channel: state.channel }) }); return load(); }
  if (t.id === 'join') { await fetch('/slack/_ui/join', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ team: view.team, channel: state.channel, user: view.user, join: true }) }); return load(); }
  if (t.tagName === 'BUTTON' && t.dataset.action) return action(t);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'team') { view = { team: t.value, user: '', channel: '', thread: '', home: false }; return load(); }
  if (t.id === 'user') { view.user = t.value; view.thread = ''; return load(); }
  if (t.tagName === 'SELECT' && t.dataset.action) return action(t, { type: 'static_select', selected: t.value });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && (e.target.id === 'composer' || e.target.id === 'thread-composer')) {
    e.preventDefault(); (e.target.id === 'composer' ? $('send') : $('thread-send')).click();
  }
});
load();
setInterval(() => { if (document.activeElement && document.activeElement.tagName === 'SELECT') return; load(); }, 1000);
</script>
</body>
</html>

# Render Blueprint: every Render resource for this product lives here.
# Spec: https://render.com/docs/blueprint-spec  Schema: dev/schemas/render.schema.json
# Checked by backend/tests/test_render_blueprint.py and exercised by `make render-sim`.
#
# Secrets are `sync: false`: Render prompts for them once, in the dashboard, when the Blueprint
# is first created. They never appear in this file. See docs/runbooks/deploy.md.

previews:
  generation: manual
  expireAfterDays: 3

projects:
  - name: agent-platform-staging
    environments:
      - name: staging
        networking:
          isolation: enabled

        envVarGroups:
          # Shared, non secret settings for every backend process.
          - name: backend-staging
            envVars:
              - key: ENV
                value: staging
              - key: LOG_LEVEL
                value: INFO
              - key: TEMPORAL_TASK_QUEUE
                value: agent-tasks
              - key: ENCRYPTION_ACTIVE_KEY
                value: v1
              # Cloudflare R2 (S3 compatible); see decisions D-050.
              - key: S3_REGION
                value: auto
              - key: S3_BUCKET
                value: agent-artifacts-staging

          # One generated password per component login user (created by `app migrate`).
          # Render generates each value once; services only reference the groups they need.
          - name: db-api-staging
            envVars:
              - key: DB_API_PASSWORD
                generateValue: true
          - name: db-worker-staging
            envVars:
              - key: DB_WORKER_PASSWORD
                generateValue: true
          - name: db-vault-staging
            envVars:
              - key: DB_VAULT_PASSWORD
                generateValue: true
          - name: db-identity-staging
            envVars:
              - key: DB_IDENTITY_PASSWORD
                generateValue: true
          - name: db-maintenance-staging
            envVars:
              - key: DB_MAINTENANCE_PASSWORD
                generateValue: true
          # The bearer token the API and worker present to the token vault service.
          - name: vault-token-staging
            envVars:
              - key: VAULT_SERVICE_TOKEN
                generateValue: true

        databases:
          - name: db-staging
            region: oregon
            plan: basic-256mb
            previewPlan: basic-256mb
            postgresMajorVersion: "16"
            databaseName: agent
            connectionPool: pgbouncer
            ipAllowList: []

        services:
          # FastAPI: Slack ingress (/slack/*), console API (/api/*), health (/healthz).
          - type: web
            name: api-staging
            runtime: docker
            region: oregon
            plan: starter
            branch: main
            autoDeployTrigger: checksPass
            dockerContext: ./backend
            dockerfilePath: ./backend/Dockerfile
            dockerCommand: app api
            # Migrations block the deploy if they fail, instead of breaking a running version.
            preDeployCommand: app migrate
            healthCheckPath: /healthz
            maxShutdownDelaySeconds: 30
            numInstances: 1
            buildFilter:
              paths: ["backend/**", "render.yaml"]
            previews:
              plan: starter
              numInstances: 1
            envVars:
              - fromGroup: backend-staging
              # `app migrate` (preDeployCommand) creates every component's login user, so this
              # service references every password group.
              - fromGroup: db-api-staging
              - fromGroup: db-worker-staging
              - fromGroup: db-vault-staging
              - fromGroup: db-identity-staging
              - fromGroup: db-maintenance-staging
              - key: MIGRATION_DATABASE_URL
                fromDatabase:
                  name: db-staging
                  property: connectionString
              - key: DATABASE_URL
                fromDatabase:
                  name: db-staging
                  property: connectionPoolString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: kv-staging
                  property: connectionString
              - key: TEMPORAL_ADDRESS
                sync: false
              - key: TEMPORAL_NAMESPACE
                sync: false
              - key: TEMPORAL_API_KEY
                sync: false
              # Secrets live in the token vault service, on the private network.
              - fromGroup: vault-token-staging
              - key: VAULT_URL
                fromService:
                  type: pserv
                  name: vault-staging
                  property: hostport
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              # OTLP/HTTP collector; empty until the tracing backend is chosen (phase 7).
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false
              # Clerk: issuer = the instance's Frontend API URL; JWKS from it (or /v1/jwks).
              - key: CONSOLE_ORIGINS
                sync: false
              - key: CLERK_ISSUER
                sync: false
              - key: CLERK_JWKS_URL
                sync: false
              - key: CLERK_SECRET_KEY
                sync: false
              - key: CLERK_WEBHOOK_SECRET
                sync: false
              # Slack app (slack/manifest.yaml). API_PUBLIC_URL builds the OAuth redirect URL.
              - key: API_PUBLIC_URL
                sync: false
              - key: CONSOLE_URL
                sync: false
              - key: SLACK_CLIENT_ID
                sync: false
              - key: SLACK_CLIENT_SECRET
                sync: false
              - key: SLACK_SIGNING_SECRET
                sync: false
              - key: SLACK_STATE_SECRET
                generateValue: true
              # Integrations (B-007): public client ids build the authorize URLs; the secrets and
              # the GitHub App key are set on vault-staging only. Callback URLs are
              # API_PUBLIC_URL/oauth/<key>/callback; the GitHub App setup URL is
              # API_PUBLIC_URL/oauth/github/install.
              - key: OAUTH_STATE_SECRET
                generateValue: true
              - key: ATLASSIAN_CLIENT_ID
                sync: false
              - key: GITHUB_APP_SLUG
                sync: false
              - key: GITHUB_CLIENT_ID
                sync: false
              # The GitHub App's webhook secret (reviews and failed checks on the agent's pull requests).
              - key: GITHUB_WEBHOOK_SECRET
                sync: false
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_MCP_URL
                sync: false

          # Temporal workers: agent tasks, schedules, approvals.
          - type: worker
            name: worker-staging
            runtime: docker
            region: oregon
            plan: starter
            branch: main
            autoDeployTrigger: checksPass
            dockerContext: ./backend
            dockerfilePath: ./backend/Dockerfile
            dockerCommand: app worker
            # Workers stop polling on SIGTERM and drain in-flight activities (100 s below).
            maxShutdownDelaySeconds: 120
            numInstances: 1
            buildFilter:
              paths: ["backend/**", "render.yaml"]
            previews:
              plan: starter
              numInstances: 1
            envVars:
              - fromGroup: backend-staging
              - fromGroup: db-worker-staging
              - fromGroup: vault-token-staging
              - key: VAULT_URL
                fromService:
                  type: pserv
                  name: vault-staging
                  property: hostport
              # Google's MCP server, called with each person's own token (B-007).
              - key: GOOGLE_MCP_URL
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: db-staging
                  property: connectionPoolString
              - key: WORKER_GRACEFUL_SHUTDOWN_SECONDS
                value: 100
              - key: CONSOLE_URL
                sync: false
              # Model provider (Anthropic API key, B-005). Without it the agent only acknowledges.
              - key: ANTHROPIC_API_KEY
                sync: false
              # Sandbox provider for repository work (B-008). Without it the code tools say so.
              - key: SANDBOX_URL
                sync: false
              - key: SANDBOX_API_KEY
                sync: false
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: kv-staging
                  property: connectionString
              - key: TEMPORAL_ADDRESS
                sync: false
              - key: TEMPORAL_NAMESPACE
                sync: false
              - key: TEMPORAL_API_KEY
                sync: false
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              # OTLP/HTTP collector; empty until the tracing backend is chosen (phase 7).
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false

          # Token vault: the only holder of the envelope master keys, the vault database user, the
          # providers' client secrets and the GitHub App key. Private network only; the API and
          # worker call it with VAULT_SERVICE_TOKEN.
          - type: pserv
            name: vault-staging
            runtime: docker
            region: oregon
            plan: starter
            branch: main
            autoDeployTrigger: checksPass
            dockerContext: ./backend
            dockerfilePath: ./backend/Dockerfile
            dockerCommand: app vault
            maxShutdownDelaySeconds: 30
            numInstances: 1
            buildFilter:
              paths: ["backend/**", "render.yaml"]
            previews:
              plan: starter
              numInstances: 1
            envVars:
              - fromGroup: backend-staging
              - fromGroup: db-vault-staging
              - fromGroup: vault-token-staging
              # A fixed port, so VAULT_URL (its hostport) is known to the API and worker.
              - key: PORT
                value: 10000
              - key: DATABASE_URL
                fromDatabase:
                  name: db-staging
                  property: connectionPoolString
              # Envelope encryption master keys ("v1:<base64 32 bytes>"); generate with
              # `python -c "import base64,os;print('v1:'+base64.b64encode(os.urandom(32)).decode())"`.
              - key: ENCRYPTION_KEYS
                sync: false
              # Integration providers (B-007): token exchange and refresh happen here only.
              - key: ATLASSIAN_CLIENT_ID
                sync: false
              - key: ATLASSIAN_CLIENT_SECRET
                sync: false
              - key: GITHUB_APP_ID
                sync: false
              - key: GITHUB_APP_PRIVATE_KEY
                sync: false
              - key: GITHUB_CLIENT_ID
                sync: false
              - key: GITHUB_CLIENT_SECRET
                sync: false
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_CLIENT_SECRET
                sync: false
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false

          # Partitions, retention and offboarding, Slack and task reconciliation, schedule sync, alerts.
          - type: cron
            name: maintenance-staging
            runtime: docker
            region: oregon
            plan: starter
            branch: main
            autoDeployTrigger: checksPass
            schedule: "*/15 * * * *"
            dockerContext: ./backend
            dockerfilePath: ./backend/Dockerfile
            dockerCommand: app maintenance
            buildFilter:
              paths: ["backend/**", "render.yaml"]
            envVars:
              - fromGroup: backend-staging
              - fromGroup: db-maintenance-staging
              # Destroys expired sandboxes at the provider (B-008).
              - key: SANDBOX_URL
                sync: false
              - key: SANDBOX_API_KEY
                sync: false
              # Starts Slack membership reconciliations through Temporal; offboarding deletes schedules.
              - key: TEMPORAL_ADDRESS
                sync: false
              - key: TEMPORAL_NAMESPACE
                sync: false
              - key: TEMPORAL_API_KEY
                sync: false
              # Alerts go to a Slack incoming webhook; unset, they are only logged (plan phase 13).
              - key: ALERT_WEBHOOK_URL
                sync: false
              # Retention and offboarding delete objects and an offboarded org's keys (plan phase 13).
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: kv-staging
                  property: connectionString
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: db-staging
                  property: connectionPoolString

          # React console, built by Render, served as a single page app.
          - type: web
            name: web-staging
            runtime: static
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: cd web && corepack pnpm install --frozen-lockfile && corepack pnpm build
            staticPublishPath: ./web/dist
            buildFilter:
              paths: ["web/**"]
            previews:
              generation: manual
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=()
              - path: /*
                name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              # Report only until the Clerk sign in is verified on staging (B-003), then enforced
              # (Content-Security-Policy). Clerk's Frontend API, its bot check and the API only.
              - path: /*
                name: Content-Security-Policy-Report-Only
                value: >-
                  default-src 'self';
                  script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com;
                  connect-src 'self' https://api-staging-u9gh.onrender.com https://*.clerk.accounts.dev;
                  img-src 'self' data: https://img.clerk.com;
                  style-src 'self' 'unsafe-inline';
                  font-src 'self' data:;
                  frame-src https://challenges.cloudflare.com;
                  worker-src 'self' blob:;
                  object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
              - path: /assets/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
              - path: /index.html
                name: Cache-Control
                value: no-cache
            envVars:
              - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
                value: "0"
              # Public URL of api-staging; a Blueprint cannot reference another web service's
              # public URL, so it is entered once in the dashboard.
              - key: VITE_API_URL
                sync: false
              # Clerk publishable key: switches the console from the dev sign in to Clerk.
              - key: VITE_CLERK_PUBLISHABLE_KEY
                sync: false

          # Redis compatible store: dedupe keys, locks, rate counters, membership cache.
          - type: keyvalue
            name: kv-staging
            region: oregon
            plan: starter
            previewPlan: starter
            # Locks and dedupe keys must never be evicted silently.
            maxmemoryPolicy: noeviction
            # Empty list: reachable only on the private network.
            ipAllowList: []

  # Production is created empty now and filled in phase 13 from this same file.
  - name: agent-platform-production
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
